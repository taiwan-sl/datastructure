<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guess the 2-Digit Number</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e8e8e8;
    }

    .game {
      background: #16213e;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      text-align: center;
      max-width: 320px;
    }

    h1 { margin: 0 0 8px; font-size: 22px; }
    .subtitle { font-size: 14px; opacity: 0.7; margin-bottom: 20px; }

    .message {
      font-size: 18px;
      font-weight: 500;
      margin: 12px 0 14px;
      min-height: 20px;
    }

    .attempts {
      font-size: 13px;
      opacity: 0.6;
      margin-bottom: 16px;
    }

    input {
      width: 80px;
      padding: 10px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      text-align: center;
      background: #0f3460;
      color: #fff;
      margin-bottom: 12px;
    }

    input:invalid { opacity: 0.6; }

    button {
      padding: 10px 18px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.05s, filter 0.2s;
    }

    button:active { transform: scale(0.98); }
    .btn-guess {
      background: #e94560;
      color: #fff;
      font-weight: 600;
    }
    .btn-restart {
      background: #1a1a2e;
      color: #e8e8e8;
      display: none;
    }

    .win-anim {
      animation: pulse 0.6s ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="game" id="game">
    <h1>Guess the Number</h1>
    <p class="subtitle">I'm thinking of a 2-digit number (10–99).</p>
    <div class="message" id="message">Your turn!</div>
    <div class="attempts">Attempts: <span id="attempts">0</span>/10</div>
    <input type="number" id="guess" min="10" max="99" placeholder="10-99" />
    <button class="btn-guess" id="guessBtn">Guess</button>
    <button class="btn-restart" id="restartBtn">Try Again</button>
  </div>

  <script>
    let target, attempts, maxAttempts;

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function init() {
      target = rand(10, 99);
      attempts = 0;
      maxAttempts = 10;

      setMessage("Your turn!");
      document.getElementById("attempts").textContent = attempts;
      document.getElementById("guess").value = "";
      document.getElementById("guess").disabled = false;
      document.getElementById("guessBtn").style.display = "inline-block";
      document.getElementById("restartBtn").style.display = "none";
      document.getElementById("guess").focus();
    }

    function setMessage(text, anim = false) {
      const el = document.getElementById("message");
      el.textContent = text;
      if (anim) el.classList.add("win-anim");
      else el.classList.remove("win-anim");
    }

    function guess() {
      const g = parseInt(document.getElementById("guess").value);
      if (!Number.isFinite(g) || g < 10 || g > 99) {
        setMessage("Please enter a 2-digit number (10–99).");
        return;
      }
      if (g === target) {
        setMessage(`Correct! The number was ${target}.`, true);
        endGame();
        return;
      }
      attempts++;
      document.getElementById("attempts").textContent = attempts;
      if (g > target) {
        setMessage("Too high. Try again.");
      } else {
        setMessage("Too low. Try again.");
      }
      if (attempts >= maxAttempts) {
        setMessage(`Game over. The number was ${target}.`);
        endGame();
      }
      document.getElementById("guess").value = "";
      document.getElementById("guess").focus();
    }

    function endGame() {
      const btn = document.getElementById("guessBtn");
      const restart = document.getElementById("restartBtn");
      btn.style.display = "none";
      restart.style.display = "inline-block";
      restart.onclick = () => init();
    }

    document.getElementById("guessBtn").onclick = guess;
    document.getElementById("guess").addEventListener("keydown", e => {
      if (e.key === "Enter") guess();
    });
    document.getElementById("restartBtn").onclick = () => init();

    init();
  </script>
</body>
</html>

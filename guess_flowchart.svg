<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node { fill: #fff; stroke: #333; stroke-width: 2px; rx: 8; ry: 8; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .text { font-family: sans-serif; font-size: 14px; text-anchor: middle; }
    .label { font-family: monospace; font-size: 14px; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Start Node -->
  <rect x="50" y="50" width="120" height="40" class="node" />
  <text x="110" y="75" class="text">Start</text>

  <!-- Generate Number -->
  <rect x="210" y="50" width="120" height="40" class="node" />
  <text x="270" y="75" class="text">Generate number</text>
  <text x="270" y="95" class="label">(10–99)</text>

  <!-- Guess Input -->
  <rect x="370" y="50" width="120" height="40" class="node" />
  <text x="430" y="75" class="text">Player enters guess</text>

  <!-- Feedback Node -->
  <rect x="50" y="170" width="120" height="40" class="node" />
  <text x="110" y="195" class="text">Feedback</text>
  
  <!-- Too High / Too Low (merged for simplicity) -->
  <rect x="210" y="170" width="120" height="40" class="node" />
  <text x="270" y="195" class="text">Too High / Too Low</text>

  <!-- Correct -->
  <rect x="370" y="170" width="120" height="40" class="node" />
  <text x="430" y="195" class="text">Correct!</text>

  <!-- Check Attempts -->
  <rect x="50" y="270" width="120" height="40" class="node" />
  <text x="110" y="295" class="text">Attempts < 10?</text>

  <!-- End Node -->
  <rect x="370" y="270" width="120" height="40" class="node" />
  <text x="430" y="295" class="text">End Game</text>

  <!-- Arrows -->
  <path d="M170 80 H210 V80" class="arrow" />
  <path d="M330 80 H370 V80" class="arrow" />
  
  <path d="M110 195 V230 H210" class="arrow" />
  <path d="M110 230 H170" class="arrow" />
  
  <path d="M270 195 H330" class="arrow" />
  
  <path d="M430 195 V230 H330" class="arrow" />
  
  <path d="M110 295 V230 H330" class="arrow" />
</svg>
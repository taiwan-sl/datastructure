<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康威生命遊戲</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">康威生命遊戲</h4>
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="btn-group w-100">
                                <button class="btn btn-success" id="btn-start">開始</button>
                                <button class="btn btn-warning" id="btn-stop">暫停</button>
                                <button class="btn btn-primary" id="btn-reset">重置</button>
                            </div>
                            <span class="text-muted">速度：<span id="speed-display">300</span>ms</span>
                        </div>
                        <div class="text-center mb-3">
                            <small class="text-muted">點擊網格中的任何細胞來改變其狀態</small>
                        </div>
                        <div id="game-container" class="game-container"></div>
                        <div class="mt-3 d-flex justify-content-between align-items-center">
                            <small class="text-muted">世代：<span id="gen-display">0</span></small>
                            <div>
                                <button class="btn btn-sm btn-secondary me-1" id="btn-random">隨機</button>
                                <button class="btn btn-sm btn-outline-danger" id="btn-clear">清空</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
